<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delivery Address | Bundle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f4f4;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.2);
        }

        .title{
            color:#d4a017;
            font-weight:bold;
        }

        .btn-warning{
            background:#d4a017;
            border:none;
        }

        .btn-warning:hover{
            background:#b8860b;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card p-5">

                <h2 class="text-center title mb-4">

                    Delivery Address

                </h2>

                <form action="/address" method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="fullname"
                                   placeholder="Enter Full Name"
                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Mobile Number

                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="mobile"
                                   placeholder="9876543210"
                                   maxlength="10"
                                   required>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            House No / Street

                        </label>

                        <textarea class="form-control"
                                  name="address"
                                  rows="3"
                                  placeholder="Flat No, Street, Area"
                                  required></textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                City

                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="city"
                                   placeholder="City"
                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                State

                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="state"
                                   placeholder="State"
                                   required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Pincode

                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="pincode"
                                   placeholder="500001"
                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Landmark

                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="landmark"
                                   placeholder="Near Temple / Bus Stop">

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Delivery Instructions

                        </label>

                        <textarea class="form-control"
                                  name="instructions"
                                  rows="2"
                                  placeholder="Optional"></textarea>

                    </div>
                    <input type="radio"
                           name="payment_method"
                           value="Online"
                           checked>

                                Online Payment

                    <input type="radio"
                           name="payment_method"
                           value="COD">

                                Cash On Delivery

                    <div class="d-grid">

                        <button type="submit"
                                class="btn btn-warning btn-lg">

                            Continue to Payment

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
