<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bundle | Delivery Address</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#F8F9FA;

        }

        .address-card{

            background:white;

            border-radius:20px;

            box-shadow:0 8px 25px rgba(0,0,0,.15);

        }

        .title{

            color:#0A3D91;

            font-weight:bold;

        }

        .btn-bundle{

            background:#FFC107;

            color:black;

            font-weight:bold;

            border:none;

        }

        .btn-bundle:hover{

            background:#e6ac00;

        }

        .form-label{

            font-weight:600;

            color:#0A3D91;

        }

        .payment-box{

            background:#EAF2FF;

            border-left:5px solid #0A3D91;

            border-radius:10px;

            padding:15px;

        }

    </style>

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card address-card p-5">

<h2 class="text-center title mb-4">

Delivery Address

</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Full Name

</label>

<input type="text"

class="form-control"

name="fullname"

required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mobile Number

</label>

<input type="text"

class="form-control"

name="mobile"

maxlength="10"

required>

</div>

</div>

<div class="mb-3">

<label class="form-label">

House No / Flat / Street

</label>

<textarea

class="form-control"

name="address"

rows="3"

required>

</textarea>

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

City

</label>

<input type="text"

class="form-control"

name="city"

required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

State

</label>

<input type="text"

class="form-control"

name="state"

required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Pincode

</label>

<input type="text"

class="form-control"

name="pincode"

required>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Landmark

</label>

<input type="text"

class="form-control"

name="landmark">

</div>

<div class="mb-4">

<label class="form-label">

Delivery Instructions

</label>

<textarea

class="form-control"

name="instructions"

rows="2"

placeholder="Optional">

</textarea>

</div>

<div class="payment-box mb-4">

<h5 class="text-primary">

Payment Method

</h5>

<p class="mb-0">

💳 Online Payment using

<strong>Razorpay</strong>

</p>

</div>

<div class="d-grid">
<hr>

<h4 class="text-primary mb-3">

Payment Method

</h4>

<div class="form-check mb-2">

    <input class="form-check-input"
           type="radio"
           name="payment_method"
           id="online"
           value="Online"
           checked>

    <label class="form-check-label" for="online">

        💳 Pay Online (Razorpay)

    </label>

</div>

<div class="form-check mb-4">

    <input class="form-check-input"
           type="radio"
           name="payment_method"
           id="cod"
           value="COD">

    <label class="form-check-label" for="cod">

        🚚 Cash on Delivery

    </label>

</div>

<button

type="submit"

class="btn btn-bundle btn-lg">

Continue to Secure Payment

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</body>

</html>
