{% extends "base.html" %}

{% block title %}Delivery Address - Bundle{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning">

                    <h3 class="mb-0">
                        Delivery Address
                    </h3>

                </div>

                <div class="card-body">

                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-success">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    {% endwith %}

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="fullname"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="mobile"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                House No / Building
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="house"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Street / Area
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="street"
                                required>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="city"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    State
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="state"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Pincode
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="pincode"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Country
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    name="country"
                                    value="India"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Landmark
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="landmark">

                        </div>

                        <div class="d-grid mt-4">

                            <button
                                type="submit"
                                class="btn btn-warning btn-lg">

                                Save Address

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
