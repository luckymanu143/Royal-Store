{% extends "base.html" %}

{% block title %}Add Product - Bundle{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-warning text-dark">

                    <h3 class="mb-0">
                        Add New Product
                    </h3>

                </div>

                <div class="card-body">

                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-success">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST"
                          enctype="multipart/form-data">

                        <div class="mb-3">

                            <label class="form-label">

                                Product Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Category

                            </label>

                            <select
                                class="form-select"
                                name="category"
                                required>

                                <option value="">Select Category</option>

                                <option>T-Shirts</option>

                                <option>Shirts</option>

                                <option>Jeans</option>

                                <option>Hoodies</option>

                                <option>Shorts</option>

                                <option>Track Pants</option>

                                <option>Shoes</option>

                                <option>Accessories</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Price (₹)

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="price"
                                min="1"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Product Description

                            </label>

                            <textarea
                                class="form-control"
                                name="description"
                                rows="5"
                                required></textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Product Image

                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="image"
                                accept=".jpg,.jpeg,.png,.webp"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-warning btn-lg">

                                Add Product

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
