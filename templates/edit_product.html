<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card bg-black text-white p-4">

                <h2 class="text-warning text-center mb-4">
                    Edit Product
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Product Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ product.name }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Price
                        </label>

                        <input type="number"
                               name="price"
                               class="form-control"
                               value="{{ product.price }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Image Name
                        </label>

                        <label class="form-label">

Current Image

</label>

<br>

<img src="{{ url_for('static', filename='images/' + product.image) }}"
     width="120"
     class="mb-3">

                    <input
                        type="file"
                        name="image"
                        class="form-control"
                        accept="image/*">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <input type="text"
                               name="category"
                               class="form-control"
                               value="{{ product.category }}">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="4">{{ product.description }}</textarea>

                    </div>

                    <button class="btn btn-warning w-100">

                        Update Product

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
