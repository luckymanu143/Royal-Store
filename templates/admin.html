<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Bundle Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container py-5">

<h1 class="text-warning text-center mb-5">
Bundle Admin Dashboard
</h1>

<div class="row text-center mb-5">

<div class="col-md-4">

<div class="card bg-black text-warning p-4">

<h3>{{ total_products }}</h3>

<p>Total Products</p>

</div>

</div>

<div class="col-md-4">

<div class="card bg-black text-warning p-4">

<h3>{{ total_orders }}</h3>

<p>Total Orders</p>

</div>

</div>

<div class="col-md-4">

<div class="card bg-black text-warning p-4">

<h3>{{ total_users }}</h3>

<p>Total Users</p>

</div>

</div>

</div>

<div class="text-center mb-4">

<a href="/add_product"
   class="btn btn-warning">

Add Product

</a>

<a href="/orders"
   class="btn btn-info ms-2">

    Manage Orders

</a>

</div>

<h2 class="text-warning mb-4">
Products
</h2>

<div class="row">

{% for product in products %}

<div class="col-md-3 mb-4">

<div class="card bg-black text-white p-3">

<img src="{{ url_for('static',
filename='images/' + product.image) }}"
class="img-fluid">

<h5 class="mt-3">
{{ product.name }}
</h5>

<p>₹{{ product.price }}</p>

<a href="/edit_product/{{ product.id }}"
class="btn btn-primary mb-2">

Edit

</a>

<a href="/delete_product/{{ product.id }}"
class="btn btn-danger">

Delete

</a>

</div>

</div>

{% endfor %}

</div>

</div>

</body>

</html>
