<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-dark text-white">

<div class="container py-5">

    <h1 class="text-warning mb-5 text-center">
        Shopping Cart
    </h1>

    {% if cart %}

        <div class="row">

            {% for item in cart %}

            <div class="col-md-12 mb-4">

                <div class="card bg-black text-white p-3">

                    <div class="row align-items-center">

                        <div class="col-md-3">

                            <img src="{{ url_for('static', filename='images/' + item.image) }}"
                                 class="img-fluid rounded">

                        </div>

                        <div class="col-md-3">

                            <h4>{{ item.name }}</h4>

                        </div>

                        <div class="col-md-3">

                            <h5>₹{{ item.price }}</h5>

                        </div>

                        <div class="col-md-3">

                            <a href="/remove_from_cart/{{ loop.index0 }}"
                               class="btn btn-danger">

                                Remove

                            </a>

                        </div>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

        <div class="text-end mt-4">

            <h2 class="text-warning">
                Total: ₹{{ total }}
            </h2>

                <a href="/address" class="btn btn-warning">
                        Proceed to Delivery Address
                </a>

        </div>

    {% else %}

        <h3 class="text-center">
            Your cart is empty
        </h3>

    {% endif %}

</div>

</body>
</html>
