<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Bundle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container py-5">

    <h1 class="text-warning text-center mb-5">
        Checkout
    </h1>

    <div class="row">

        <!-- Order Summary -->

        <div class="col-md-8">

            <div class="card bg-black text-white p-4">

                <h3 class="text-warning mb-4">
                    Order Summary
                </h3>

                {% if cart %}

                    {% for item in cart %}

                    <div class="row align-items-center mb-3">

                        <div class="col-md-3">

                            <img src="{{ url_for('static', filename='images/' + item.image) }}"
                                 class="img-fluid rounded">

                        </div>

                        <div class="col-md-6">

                            <h5>{{ item.name }}</h5>

                        </div>

                        <div class="col-md-3">

                            <h5>₹{{ item.price }}</h5>

                        </div>

                    </div>

                    <hr>

                    {% endfor %}

                {% else %}

                    <h4>Your Cart Is Empty</h4>

                {% endif %}

            </div>

        </div>

        <!-- Payment Section -->

        <div class="col-md-4">

            <div class="card bg-black text-white p-4">

                <h3 class="text-warning mb-4">
                    Payment Details
                </h3>

                <h4>
                    Total Amount
                </h4>

                <h2 class="text-warning mb-4">
                    ₹{{ total }}
                </h2>

                <!-- Demo Payment -->

                <a href="/success"
                   class="btn btn-warning btn-lg w-100">

                    Place Order

                </a>

                <a href="/cart"
                   class="btn btn-outline-light mt-3 w-100">

                    Back To Cart

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
