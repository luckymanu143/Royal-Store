<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | Bundle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .checkout-card{
            border-radius:15px;
            border:none;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        .title{
            color:#d4a017;
            font-weight:bold;
        }

        .price{
            color:#d4a017;
            font-size:22px;
            font-weight:bold;
        }

        img{
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row">

        <!-- Order Summary -->

        <div class="col-lg-8">

            <div class="card checkout-card p-4">

                <h2 class="title mb-4">

                    Order Summary

                </h2>

                {% if cart %}

                    {% for item in cart %}

                    <div class="row align-items-center mb-3">

                        <div class="col-md-2">

                            <img src="{{ url_for('static', filename='images/' + item.image) }}"
                                 class="img-fluid">

                        </div>

                        <div class="col-md-6">

                            <h5>{{ item.name }}</h5>

                        </div>

                        <div class="col-md-4 text-end">

                            <h5 class="price">

                                ₹{{ item.price }}

                            </h5>

                        </div>

                    </div>

                    <hr>

                    {% endfor %}

                {% else %}

                    <h4>Your cart is empty.</h4>

                {% endif %}

            </div>

        </div>

        <!-- Payment Card -->

        <div class="col-lg-4">

            <div class="card checkout-card p-4">

                <h3 class="title">

                    Payment Summary

                </h3>

                <hr>

                <div class="d-flex justify-content-between">

                    <h5>Total Amount</h5>

                    <h4 class="price">

                        ₹{{ total }}

                    </h4>

                </div>

                <hr>

                <button id="rzp-button1"
                        class="btn btn-warning btn-lg w-100">

                    Pay ₹{{ total }}

                </button>

                <a href="/cart"
                   class="btn btn-outline-secondary mt-3 w-100">

                    Back To Cart

                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

var options = {

    "key":"{{ razorpay_key }}",

    "amount":"{{ payment.amount }}",

    "currency":"INR",

    "name":"Bundle",

    "description":"Order Payment",

    "image":"{{ url_for('static', filename='images/logo.png') }}",

    "order_id":"{{ payment.id }}",

    "handler": function (response){

        window.location.href="/payment_success?payment_id="+response.razorpay_payment_id;

    },

    "prefill":{

        "name":"",

        "email":"",

        "contact":""

    },

    "theme":{

        "color":"#d4a017"

    }

};

var rzp = new Razorpay(options);

document.getElementById("rzp-button1").onclick = function(e){

    rzp.open();

    e.preventDefault();

}

</script>

</body>

</html>
